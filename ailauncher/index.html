<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Client - Delete & Manage Models</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 320px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            transition: width 0.3s ease, padding 0.3s ease, margin-left 0.3s ease;
            position: relative;
            z-index: 20;
        }

        aside.collapsed {
            width: 0;
            padding: 0;
            overflow: hidden;
            border-right: none;
        }

        .aside-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-toggle-sidebar {
            background: transparent;
            border: 1px solid #30363d;
            color: #f0f6fc;
            font-size: 18px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-toggle-sidebar:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .profile-box {
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .btn-danger:hover {
            background: rgba(248, 81, 73, 0.4);
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #f0f6fc;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        .btn-save {
            background: linear-gradient(90deg, #238636, #2ea043);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        .status-badge {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
        }

        .status-off {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .status-on {
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        .token-header {
            background: rgba(22, 27, 34, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8b949e;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .chat-selector {
            max-width: 260px;
            padding: 6px 10px;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 13px;
            outline: none;
        }

        .btn-new-chat-top {
            background: #1f6feb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-new-chat-top:hover {
            background: #388bfd;
        }

        .btn-del-chat-top {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.4);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .token-count-badge {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            gap: 4px;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #8b949e;
            padding: 0 4px;
        }

        .token-info {
            font-size: 10px;
            color: #6e7681;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #1f6feb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot .bubble {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-bottom-left-radius: 2px;
        }

        .attached-files-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .file-chip {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-chip span {
            cursor: pointer;
            font-weight: bold;
            color: #f85149;
        }

        .input-area {
            padding: 16px 24px 20px;
            background: rgba(22, 27, 34, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-attach {
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            color: #8b949e;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-attach:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        textarea {
            flex: 1;
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            color: #f0f6fc;
            font-size: 15px;
            resize: none;
            height: 48px;
            outline: none;
        }

        textarea:focus {
            border-color: #58a6ff;
        }

        .live-tokens {
            font-size: 11px;
            color: #8b949e;
            text-align: right;
            padding-right: 60px;
        }

        .btn-send {
            background: #1f6feb;
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: #388bfd;
        }

        .btn-send:disabled {
            background: #21262d;
            cursor: not-allowed;
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 80vh;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            cursor: pointer;
            font-size: 20px;
            color: #8b949e;
        }

        .model-manage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 4px;
        }

        .model-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 13px;
        }

        .model-info-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .model-info-text strong {
            color: #f0f6fc;
        }

        .model-info-text span {
            font-size: 11px;
            color: #8b949e;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; padding: 16px; }
            aside.collapsed { height: 0; padding: 0; }
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside id="sidebar">
        <div class="aside-header">
            <div class="logo">⚡ Universal AI</div>
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Recolher Barra Lateral">☰</button>
        </div>

        <!-- CONFIGURAÇÕES DE PERFIS -->
        <div class="profile-box">
            <div class="profile-header">
                <label for="profileSelect">Perfil Ativo</label>
                <button class="btn-sm btn-danger" onclick="deleteCurrentProfile()">Excluir</button>
            </div>
            <select id="profileSelect" onchange="switchProfile()">
                <!-- Preenchido via JS -->
            </select>
            <button class="btn-save" style="background: #388bfd; font-size: 12px; padding: 6px;" onclick="createNewProfile()">+ Novo Perfil</button>
        </div>

        <div id="statusBadge" class="status-badge status-off">
            Perfil Não Configurado
        </div>

        <div class="config-group">
            <label for="profileName">Nome do Perfil</label>
            <input type="text" id="profileName" placeholder="ex: OpenRouter Principal">
        </div>

        <div class="config-group">
            <label for="providerSelect">Provedor / API</label>
            <select id="providerSelect" onchange="toggleProvider()">
                <option value="openrouter">OpenRouter / OpenAI-Compatible</option>
                <option value="gemini">Google Gemini (Oficial)</option>
            </select>
        </div>

        <div class="config-group" id="baseUrlGroup">
            <label for="baseUrl">Base URL da API</label>
            <input type="text" id="baseUrl" value="https://openrouter.ai/api/v1">
        </div>

        <div class="config-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="Cole sua chave aqui...">
        </div>

        <div class="config-group">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;">
                <label for="modelSelect">Selecione o Modelo</label>
                <div style="display: flex; gap: 4px;">
                    <button class="btn-sm" style="background: #238636; color: white;" onclick="openAddModelModal()">+ Criar</button>
                    <button class="btn-sm" style="background: #30363d; color: #f0f6fc;" onclick="openManageModelsModal()">⚙️ Gerenciar</button>
                </div>
            </div>
            <select id="modelSelect" onchange="syncCustomModelInput()">
                <!-- Preenchido via JS -->
            </select>
        </div>

        <div class="config-group">
            <label for="customModel">ID do Modelo Ativo</label>
            <input type="text" id="customModel" placeholder="ex: deepseek/deepseek-r1">
        </div>

        <button class="btn-save" onclick="saveActiveProfile()">Salvar Configurações</button>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main>
        <div class="token-header">
            <div class="header-left">
                <button class="btn-toggle-sidebar" id="expandBtn" onclick="toggleSidebar()" style="display: none;" title="Abrir Barra Lateral">☰</button>
                <span>Sessão Atual:</span>
                <select id="topChatSelect" class="chat-selector" onchange="switchChatFromTop()">
                    <!-- Conversas injetadas via JS -->
                </select>
                <button class="btn-new-chat-top" onclick="createNewChat()">+ Novo Chat</button>
                <button class="btn-del-chat-top" onclick="deleteActiveChat()" title="Excluir Chat Ativo">🗑️</button>
            </div>

            <div>
                Total de Tokens: <strong id="totalChatTokens" class="token-count-badge">0 tokens</strong>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <!-- Mensagens são renderizadas aqui -->
        </div>

        <div class="input-area">
            <div id="attachedFilesContainer" class="attached-files-container"></div>
            <div class="live-tokens" id="inputTokenEstimate">Estimativa da mensagem: 0 tokens</div>
            <div class="input-wrapper">
                <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(event)">
                <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Anexar Arquivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <textarea id="userInput" placeholder="Digite sua mensagem..." rows="1" oninput="updateInputTokenCount()"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <!-- MODAL PARA ADICIONAR NOVO MODELO -->
    <div class="modal" id="addModelModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Novo Modelo</h3>
                <span class="close-modal" onclick="closeAddModelModal()">×</span>
            </div>
            <div class="config-group">
                <label for="newModelName">Nome do Modelo (Exibição)</label>
                <input type="text" id="newModelName" placeholder="ex: Qwen 2.5 7B Free">
            </div>
            <div class="config-group">
                <label for="newModelId">ID do Modelo (API)</label>
                <input type="text" id="newModelId" placeholder="ex: qwen/qwen-2.5-7b-instruct:free">
            </div>
            <button class="btn-save" onclick="saveCustomModel()">Salvar Modelo</button>
        </div>
    </div>

    <!-- MODAL PARA GERENCIAR E DELETAR MODELOS -->
    <div class="modal" id="manageModelsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gerenciar / Deletar Modelos</h3>
                <span class="close-modal" onclick="closeManageModelsModal()">×</span>
            </div>
            <div class="model-manage-list" id="manageModelsList">
                <!-- Lista de modelos para deletar -->
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const expandBtn = document.getElementById('expandBtn');
        const profileSelect = document.getElementById('profileSelect');
        const profileNameInput = document.getElementById('profileName');
        const providerSelect = document.getElementById('providerSelect');
        const baseUrlGroup = document.getElementById('baseUrlGroup');
        const baseUrlInput = document.getElementById('baseUrl');
        const apiKeyInput = document.getElementById('apiKey');
        const statusBadge = document.getElementById('statusBadge');
        const modelSelect = document.getElementById('modelSelect');
        const customModelInput = document.getElementById('customModel');
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const totalChatTokensEl = document.getElementById('totalChatTokens');
        const inputTokenEstimateEl = document.getElementById('inputTokenEstimate');
        const attachedFilesContainer = document.getElementById('attachedFilesContainer');
        const topChatSelect = document.getElementById('topChatSelect');

        let totalTokens = 0;
        let attachedFiles = [];
        let allChats = [];
        let activeChatId = "";

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            if (sidebar.classList.contains('collapsed')) {
                expandBtn.style.display = 'block';
            } else {
                expandBtn.style.display = 'none';
            }
        }

        function estimateTokens(text) {
            if (!text) return 0;
            return Math.ceil(text.trim().length / 4);
        }

        function updateInputTokenCount() {
            let fileText = attachedFiles.map(f => f.content || '').join(' ');
            const tokens = estimateTokens(userInput.value + ' ' + fileText);
            inputTokenEstimateEl.innerText = `Estimativa da mensagem: ~${tokens} tokens`;
        }

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                if (file.type.startsWith('image/')) {
                    reader.onload = (e) => {
                        attachedFiles.push({
                            name: file.name,
                            type: 'image',
                            base64: e.target.result.split(',')[1],
                            mimeType: file.type
                        });
                        renderAttachedFiles();
                    };
                    reader.readAsDataURL(file);
                } else {
                    reader.onload = (e) => {
                        attachedFiles.push({
                            name: file.name,
                            type: 'text',
                            content: e.target.result
                        });
                        renderAttachedFiles();
                    };
                    reader.readAsText(file);
                }
            });
            event.target.value = '';
        }

        function renderAttachedFiles() {
            attachedFilesContainer.innerHTML = '';
            attachedFiles.forEach((f, idx) => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';
                chip.innerHTML = `📄 ${f.name} <span onclick="removeFile(${idx})">×</span>`;
                attachedFilesContainer.appendChild(chip);
            });
            updateInputTokenCount();
        }

        function removeFile(index) {
            attachedFiles.splice(index, 1);
            renderAttachedFiles();
        }

        /* --- SESSÕES DE CHAT --- */
        function loadChats() {
            const saved = localStorage.getItem('ai_chats_history');
            if (saved) {
                allChats = JSON.parse(saved);
                activeChatId = localStorage.getItem('ai_active_chat_id') || allChats[0]?.id;
            }

            if (!allChats || allChats.length === 0) {
                createNewChat(false);
            } else {
                renderTopChatsSelect();
                loadActiveChatMessages();
            }
        }

        function createNewChat(savePrevious = true) {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'Nova Conversa ' + (allChats.length + 1),
                messages: [
                    { role: 'bot', name: 'Sistema', text: 'Olá! Conversa iniciada. Digite uma mensagem para começar!', tokens: 0 }
                ]
            };

            allChats.unshift(newChat);
            activeChatId = newChat.id;
            saveChatsToStorage();
            renderTopChatsSelect();
            loadActiveChatMessages();
        }

        function renderTopChatsSelect() {
            topChatSelect.innerHTML = '';
            allChats.forEach(chat => {
                const opt = document.createElement('option');
                opt.value = chat.id;
                opt.innerText = chat.title;
                if (chat.id === activeChatId) opt.selected = true;
                topChatSelect.appendChild(opt);
            });
        }

        function switchChatFromTop() {
            activeChatId = topChatSelect.value;
            localStorage.setItem('ai_active_chat_id', activeChatId);
            loadActiveChatMessages();
        }

        function deleteActiveChat() {
            if (allChats.length <= 1) {
                alert('Você precisa ter pelo menos um chat aberto!');
                return;
            }

            if (confirm("Deseja excluir a conversa atual?")) {
                allChats = allChats.filter(c => c.id !== activeChatId);
                activeChatId = allChats[0].id;
                saveChatsToStorage();
                renderTopChatsSelect();
                loadActiveChatMessages();
            }
        }

        function loadActiveChatMessages() {
            chatContainer.innerHTML = '';
            totalTokens = 0;

            const current = allChats.find(c => c.id === activeChatId);
            if (!current) return;

            current.messages.forEach(m => {
                appendMessageUI(m.role, m.name, m.text, m.tokens || 0);
                totalTokens += (m.tokens || 0);
            });

            totalChatTokensEl.innerText = `${totalTokens} tokens`;
        }

        function saveChatsToStorage() {
            localStorage.setItem('ai_chats_history', JSON.stringify(allChats));
            localStorage.setItem('ai_active_chat_id', activeChatId);
        }

        /* --- SISTEMA DE GERENCIAMENTO E EXCLUSÃO DE MODELOS --- */
        let initialDefaultModels = {
            openrouter: [
                { name: "GPT-4o", id: "openai/gpt-4o" },
                { name: "o1", id: "openai/o1" },
                { name: "o3-mini", id: "openai/o3-mini" },
                { name: "Claude 3.5 Sonnet", id: "anthropic/claude-3.5-sonnet" },
                { name: "Gemini 2.0 Flash", id: "google/gemini-2.0-flash-001" },
                { name: "Gemini 1.5 Pro", id: "google/gemini-pro-1.5" },
                { name: "Llama 3.3 70B", id: "meta-llama/llama-3.3-70b-instruct" },
                { name: "Llama 3.1 405B", id: "meta-llama/llama-3.1-405b-instruct" },
                { name: "DeepSeek-V4", id: "deepseek/deepseek-v4" },
                { name: "DeepSeek-V3", id: "deepseek/deepseek-chat" },
                { name: "DeepSeek-R1", id: "deepseek/deepseek-r1" },
                { name: "Qwen 3.8 Max", id: "qwen/qwen-3.8-max" },
                { name: "Qwen 2.5 72B", id: "qwen/qwen-2.5-72b-instruct" },
                { name: "Qwen 2.5 Coder", id: "qwen/qwen-2.5-coder-32b-instruct" },
                { name: "Qwen 2.5 VL", id: "qwen/qwen-2.5-vl-72b-instruct" },
                { name: "Mistral Large", id: "mistralai/mistral-large" },
                { name: "Mixtral 8x22B", id: "mistralai/mixtral-8x22b-instruct" },
                { name: "Grok 2", id: "x-ai/grok-2-1212" }
            ],
            gemini: [
                { name: "Gemini 2.0 Flash", id: "gemini-2.0-flash" },
                { name: "Gemini 1.5 Pro", id: "gemini-1.5-pro" },
                { name: "Gemini 2.5 Flash", id: "gemini-2.5-flash" },
                { name: "Gemini 2.5 Pro", id: "gemini-2.5-pro" }
            ]
        };

        function getActiveModelsList(provider) {
            const saved = localStorage.getItem('ai_all_models_v2');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed[provider]) return parsed[provider];
            }
            return initialDefaultModels[provider] || [];
        }

        function saveActiveModelsList(provider, list) {
            const saved = localStorage.getItem('ai_all_models_v2');
            let data = saved ? JSON.parse(saved) : { ...initialDefaultModels };
            data[provider] = list;
            localStorage.setItem('ai_all_models_v2', JSON.stringify(data));
        }

        function openAddModelModal() {
            document.getElementById('addModelModal').style.display = 'flex';
        }

        function closeAddModelModal() {
            document.getElementById('addModelModal').style.display = 'none';
        }

        function openManageModelsModal() {
            const provider = providerSelect.value;
            const models = getActiveModelsList(provider);
            const listContainer = document.getElementById('manageModelsList');
            
            listContainer.innerHTML = '';
            
            if (models.length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: #8b949e; padding: 20px;">Nenhum modelo cadastrado.</div>`;
            } else {
                models.forEach((m, idx) => {
                    const item = document.createElement('div');
                    item.className = 'model-manage-item';
                    item.innerHTML = `
                        <div class="model-info-text">
                            <strong>${m.name}</strong>
                            <span>${m.id}</span>
                        </div>
                        <button class="btn-sm btn-danger" onclick="deleteModelFromList('${provider}', ${idx})">Excluir</button>
                    `;
                    listContainer.appendChild(item);
                });
            }

            document.getElementById('manageModelsModal').style.display = 'flex';
        }

        function closeManageModelsModal() {
            document.getElementById('manageModelsModal').style.display = 'none';
        }

        function deleteModelFromList(provider, index) {
            let list = getActiveModelsList(provider);
            list.splice(index, 1);
            saveActiveModelsList(provider, list);
            
            toggleProvider(false);
            openManageModelsModal(); // Atualiza a lista na janela
        }

        function saveCustomModel() {
            const name = document.getElementById('newModelName').value.trim();
            const id = document.getElementById('newModelId').value.trim();
            const provider = providerSelect.value;

            if (!name || !id) {
                alert("Preencha o nome e o ID do modelo!");
                return;
            }

            let list = getActiveModelsList(provider);
            list.push({ name, id });
            saveActiveModelsList(provider, list);

            closeAddModelModal();
            document.getElementById('newModelName').value = '';
            document.getElementById('newModelId').value = '';

            toggleProvider(false);
            modelSelect.value = id;
            syncCustomModelInput();
            alert("Modelo adicionado com sucesso!");
        }

        /* --- PROVEDORES E PERFIS --- */
        const defaultProfiles = [
            {
                id: "p_default",
                name: "OpenRouter Padrão",
                provider: "openrouter",
                baseUrl: "https://openrouter.ai/api/v1",
                key: "",
                model: "openai/gpt-4o"
            }
        ];

        let profiles = [];
        let activeProfileId = "";

        window.onload = () => {
            loadProfiles();
            loadChats();
        };

        function loadProfiles() {
            const saved = localStorage.getItem('ai_profiles');
            profiles = saved ? JSON.parse(saved) : defaultProfiles;
            
            activeProfileId = localStorage.getItem('ai_active_profile_id') || profiles[0].id;

            renderProfileSelect();
            loadActiveProfileToUI();
        }

        function renderProfileSelect() {
            profileSelect.innerHTML = '';
            profiles.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                if (p.id === activeProfileId) opt.selected = true;
                profileSelect.appendChild(opt);
            });
        }

        function loadActiveProfileToUI() {
            const current = profiles.find(p => p.id === activeProfileId) || profiles[0];
            activeProfileId = current.id;

            profileNameInput.value = current.name;
            providerSelect.value = current.provider;
            baseUrlInput.value = current.baseUrl || "https://openrouter.ai/api/v1";
            apiKeyInput.value = current.key || "";
            
            toggleProvider(false);

            if (current.model) {
                customModelInput.value = current.model;
                modelSelect.value = current.model;
            }

            updateStatus(!!current.key);
        }

        function switchProfile() {
            activeProfileId = profileSelect.value;
            localStorage.setItem('ai_active_profile_id', activeProfileId);
            loadActiveProfileToUI();
        }

        function createNewProfile() {
            const newId = 'p_' + Date.now();
            const newProfile = {
                id: newId,
                name: "Novo Perfil " + (profiles.length + 1),
                provider: "openrouter",
                baseUrl: "https://openrouter.ai/api/v1",
                key: "",
                model: "deepseek/deepseek-chat"
            };

            profiles.push(newProfile);
            activeProfileId = newId;
            saveProfilesToStorage();
            renderProfileSelect();
            loadActiveProfileToUI();
        }

        function deleteCurrentProfile() {
            if (profiles.length <= 1) {
                alert("Você precisa ter pelo menos um perfil cadastrado!");
                return;
            }

            if (confirm("Tem certeza que deseja excluir o perfil ativo?")) {
                profiles = profiles.filter(p => p.id !== activeProfileId);
                activeProfileId = profiles[0].id;
                saveProfilesToStorage();
                renderProfileSelect();
                loadActiveProfileToUI();
            }
        }

        function saveActiveProfile() {
            const current = profiles.find(p => p.id === activeProfileId);
            if (!current) return;

            current.name = profileNameInput.value.trim() || "Perfil sem nome";
            current.provider = providerSelect.value;
            current.baseUrl = baseUrlInput.value.trim();
            current.key = apiKeyInput.value.trim();
            current.model = customModelInput.value.trim() || modelSelect.value;

            saveProfilesToStorage();
            renderProfileSelect();
            updateStatus(!!current.key);
            alert("Perfil salvo com sucesso!");
        }

        function saveProfilesToStorage() {
            localStorage.setItem('ai_profiles', JSON.stringify(profiles));
            localStorage.setItem('ai_active_profile_id', activeProfileId);
        }

        function toggleProvider(resetModel = true) {
            const provider = providerSelect.value;
            baseUrlGroup.style.display = provider === 'openrouter' ? 'flex' : 'none';

            modelSelect.innerHTML = '';
            
            const modelsList = getActiveModelsList(provider);

            modelsList.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                modelSelect.appendChild(opt);
            });

            if (resetModel) {
                customModelInput.value = modelSelect.value;
            }
        }

        function syncCustomModelInput() {
            customModelInput.value = modelSelect.value;
        }

        function updateStatus(active) {
            if (active) {
                statusBadge.innerText = '● Perfil Ativo & Configurado';
                statusBadge.className = 'status-badge status-on';
            } else {
                statusBadge.innerText = 'Chave API Não Configurada';
                statusBadge.className = 'status-badge status-off';
            }
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const currentProfile = profiles.find(p => p.id === activeProfileId);
            let text = userInput.value.trim();

            if (!text && attachedFiles.length === 0) return;
            if (!currentProfile || !currentProfile.key) {
                alert('O perfil ativo não tem uma API Key salva! Salve uma chave primeiro.');
                return;
            }

            const key = currentProfile.key;
            const provider = currentProfile.provider;
            const model = customModelInput.value.trim() || currentProfile.model;
            let baseUrl = currentProfile.baseUrl.replace(/\/+$/, '');

            let textFilesContent = '';
            attachedFiles.filter(f => f.type === 'text').forEach(f => {
                textFilesContent += `\n\n--- Conteúdo do Arquivo: ${f.name} ---\n${f.content}`;
            });

            const fullPromptText = text + textFilesContent;
            const userTokens = estimateTokens(fullPromptText);

            const currentChat = allChats.find(c => c.id === activeChatId);
            if (currentChat && currentChat.title.startsWith('Nova Conversa')) {
                currentChat.title = text.slice(0, 20) || 'Arquivo Anexado';
                renderTopChatsSelect();
            }

            currentChat.messages.push({
                role: 'user',
                name: 'Você',
                text: fullPromptText,
                tokens: userTokens
            });

            totalTokens += userTokens;
            appendMessageUI('user', 'Você', fullPromptText, userTokens);

            const currentFiles = [...attachedFiles];
            attachedFiles = [];
            renderAttachedFiles();
            userInput.value = '';
            updateInputTokenCount();
            sendBtn.disabled = true;

            const botMsgObj = appendMessageUI('bot', `${currentProfile.name} (${model})`, 'Pensando...', 0);

            try {
                let responseText = '';
                let realTokensUsed = 0;

                if (provider === 'gemini') {
                    let parts = [{ text: fullPromptText }];
                    currentFiles.filter(f => f.type === 'image').forEach(img => {
                        parts.push({
                            inline_data: { mime_type: img.mimeType, data: img.base64 }
                        });
                    });

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts }] })
                    });
                    const data = await res.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        responseText = data.candidates[0].content.parts[0].text;
                        realTokensUsed = data.usageMetadata?.candidatesTokenCount || estimateTokens(responseText);
                    } else if (data.error) {
                        responseText = `Erro Gemini: ${data.error.message}`;
                    }
                } else {
                    let contentArray = [{ type: 'text', text: fullPromptText }];
                    currentFiles.filter(f => f.type === 'image').forEach(img => {
                        contentArray.push({
                            type: 'image_url',
                            image_url: { url: `data:${img.mimeType};base64,${img.base64}` }
                        });
                    });

                    const res = await fetch(`${baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${key}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [{ role: 'user', content: contentArray }]
                        })
                    });
                    const data = await res.json();
                    if (data.choices && data.choices[0].message.content) {
                        responseText = data.choices[0].message.content;
                        realTokensUsed = data.usage?.completion_tokens || estimateTokens(responseText);
                    } else if (data.error) {
                        responseText = `Erro API: ${data.error.message || JSON.stringify(data.error)}`;
                    }
                }

                currentChat.messages.push({
                    role: 'bot',
                    name: `${currentProfile.name} (${model})`,
                    text: responseText,
                    tokens: realTokensUsed
                });

                totalTokens += realTokensUsed;
                totalChatTokensEl.innerText = `${totalTokens} tokens`;

                botMsgObj.bubble.innerHTML = formatMarkdown(responseText || 'Sem resposta.');
                botMsgObj.tokenTag.innerText = `~${realTokensUsed} tokens`;

                saveChatsToStorage();

            } catch (err) {
                console.error(err);
                botMsgObj.bubble.innerText = 'Erro ao se conectar com o servidor da API.';
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessageUI(role, name, text, tokenCount = 0) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta-info';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'sender-name';
            nameSpan.innerText = name;

            const tokenSpan = document.createElement('span');
            tokenSpan.className = 'token-info';
            tokenSpan.innerText = `~${tokenCount} tokens`;

            metaDiv.appendChild(nameSpan);
            metaDiv.appendChild(tokenSpan);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.innerHTML = formatMarkdown(text);

            msgDiv.appendChild(metaDiv);
            msgDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(msgDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return { bubble: bubbleDiv, tokenTag: tokenSpan };
        }

        function formatMarkdown(str) {
            return str
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
