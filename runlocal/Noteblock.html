<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Notepad</title>
    <style>
        :root {
            --bg-app: #0f0f13;
            --bg-card: #18181b;
            --bg-sidebar: #121215;
            --text-main: #fafafa;
            --text-muted: #71717a;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --danger: #ef4444;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .notepad-container {
            width: 100%;
            max-width: 950px;
            height: 85vh;
            max-height: 800px;
            background-color: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .note-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid transparent;
        }

        .note-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .note-item.active {
            background-color: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .note-item-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .note-item-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Editor Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-card);
            position: relative;
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background-color: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px);
        }

        .title-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
            outline: none;
            width: 60%;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status.visible { opacity: 1; }

        button {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--border);
            color: var(--text-main);
        }

        button.primary {
            background-color: var(--accent);
            color: #fff;
            border: none;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        button.danger:hover {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: var(--danger);
        }

        textarea {
            flex-grow: 1;
            width: 100%;
            padding: 24px;
            background-color: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.7;
            resize: none;
            outline: none;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* Locked Screen Overlay */
        .lock-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .lock-overlay input {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }

        footer {
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            background-color: rgba(24, 24, 27, 0.5);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        @media (max-width: 650px) {
            body { padding: 0; }
            .notepad-container { height: 100vh; max-height: none; border-radius: 0; border: none; flex-direction: column; }
            aside { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

<div class="notepad-container">
    <!-- Sidebar -->
    <aside>
        <div class="sidebar-header">
            <h2>📝 My Notes</h2>
            <button class="primary" onclick="createNewNote()">+ New</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search notes..." oninput="renderNotesList()">
        </div>
        <div class="notes-list" id="notesList"></div>
    </aside>

    <!-- Main Editor -->
    <main>
        <header>
            <input type="text" id="noteTitle" class="title-input" placeholder="Untitled Note..." oninput="handleContentChange()">
            <div class="header-actions">
                <span class="status" id="saveStatus">Saved ✓</span>
                <button id="lockBtn" onclick="toggleLockNote()" title="Set or remove password">🔒 Lock</button>
                <button onclick="copyContent()" title="Copy text">📋 Copy</button>
                <button class="danger" onclick="deleteNote()" title="Delete note">🗑️</button>
            </div>
        </header>

        <textarea id="noteArea" placeholder="Start typing your note here..." spellcheck="false" oninput="handleContentChange()"></textarea>

        <!-- Lock Screen Overlay (Hidden by default) -->
        <div class="lock-overlay" id="lockOverlay" style="display: none;">
            <h3>🔒 Password Protected</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Enter password to view this note</p>
            <input type="password" id="passwordAttempt" placeholder="Enter password">
            <button class="primary" onclick="unlockNote()">Unlock Note</button>
        </div>

        <footer>
            <span id="charCount">0 characters</span>
            <span id="wordCount">0 words</span>
        </footer>
    </main>
</div>

<script>
    let notes = [];
    let activeNoteId = null;
    let saveTimeout = null;

    const notesListEl = document.getElementById('notesList');
    const noteTitleEl = document.getElementById('noteTitle');
    const noteAreaEl = document.getElementById('noteArea');
    const saveStatusEl = document.getElementById('saveStatus');
    const charCountEl = document.getElementById('charCount');
    const wordCountEl = document.getElementById('wordCount');
    const lockOverlayEl = document.getElementById('lockOverlay');
    const passwordAttemptEl = document.getElementById('passwordAttempt');
    const lockBtnEl = document.getElementById('lockBtn');
    const searchInputEl = document.getElementById('searchInput');

    function init() {
        const saved = localStorage.getItem('pro_notepad_data');
        if (saved) {
            notes = JSON.parse(saved);
        }
        if (notes.length === 0) {
            createNewNote();
        } else {
            selectNote(notes[0].id);
        }
    }

    function saveToStorage() {
        localStorage.setItem('pro_notepad_data', JSON.stringify(notes));
    }

    function createNewNote() {
        const newNote = {
            id: Date.now().toString(),
            title: 'Untitled Note',
            content: '',
            password: null,
            unlocked: true,
            updatedAt: Date.now()
        };
        notes.unshift(newNote);
        saveToStorage();
        selectNote(newNote.id);
    }

    function selectNote(id) {
        activeNoteId = id;
        const note = notes.find(n => n.id === id);
        if (!note) return;

        renderNotesList();

        noteTitleEl.value = note.title;
        noteAreaEl.value = note.content;
        updateCounters();

        if (note.password && !note.unlocked) {
            lockOverlayEl.style.display = 'flex';
            passwordAttemptEl.value = '';
        } else {
            lockOverlayEl.style.display = 'none';
        }

        lockBtnEl.innerHTML = note.password ? '🔓 Unlock' : '🔒 Lock';
    }

    function renderNotesList() {
        const query = searchInputEl.value.toLowerCase();
        notesListEl.innerHTML = '';

        const filtered = notes.filter(n => 
            n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query)
        );

        filtered.forEach(note => {
            const item = document.createElement('div');
            item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
            item.onclick = () => selectNote(note.id);

            const isLocked = note.password && !note.unlocked;
            const previewText = isLocked ? 'Protected Note' : (note.content || 'Empty note...');

            item.innerHTML = `
                <div class="note-item-title">
                    <span>${note.title || 'Untitled'}</span>
                    ${note.password ? '<span>🔒</span>' : ''}
                </div>
                <div class="note-item-preview">${previewText}</div>
            `;
            notesListEl.appendChild(item);
        });
    }

    function handleContentChange() {
        const note = notes.find(n => n.id === activeNoteId);
        if (!note) return;

        note.title = noteTitleEl.value || 'Untitled Note';
        note.content = noteAreaEl.value;
        note.updatedAt = Date.now();

        updateCounters();
        renderNotesList();

        // Auto-save debounce
        saveStatusEl.textContent = 'Saving...';
        saveStatusEl.classList.add('visible');

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveToStorage();
            saveStatusEl.textContent = 'Saved ✓';
            setTimeout(() => saveStatusEl.classList.remove('visible'), 1500);
        }, 500);
    }

    function updateCounters() {
        const text = noteAreaEl.value;
        charCountEl.textContent = `${text.length} characters`;
        const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
        wordCountEl.textContent = `${words} words`;
    }

    function toggleLockNote() {
        const note = notes.find(n => n.id === activeNoteId);
        if (!note) return;

        if (note.password) {
            const pass = prompt('Enter current password to remove protection:');
            if (pass === note.password) {
                note.password = null;
                note.unlocked = true;
                saveToStorage();
                selectNote(note.id);
                alert('Password protection removed.');
            } else if (pass !== null) {
                alert('Incorrect password.');
            }
        } else {
            const pass = prompt('Set a password for this note:');
            if (pass) {
                note.password = pass;
                note.unlocked = true;
                saveToStorage();
                selectNote(note.id);
                alert('Note is now password protected!');
            }
        }
    }

    function unlockNote() {
        const note = notes.find(n => n.id === activeNoteId);
        if (!note) return;

        if (passwordAttemptEl.value === note.password) {
            note.unlocked = true;
            lockOverlayEl.style.display = 'none';
            renderNotesList();
        } else {
            alert('Incorrect password!');
        }
    }

    function deleteNote() {
        if (!activeNoteId) return;
        const note = notes.find(n => n.id === activeNoteId);

        if (confirm(`Delete "${note.title}"?`)) {
            notes = notes.filter(n => n.id !== activeNoteId);
            saveToStorage();
            if (notes.length === 0) {
                createNewNote();
            } else {
                selectNote(notes[0].id);
            }
        }
    }

    function copyContent() {
        if (!noteAreaEl.value) return;
        navigator.clipboard.writeText(noteAreaEl.value).then(() => {
            const btn = event.target.closest('button');
            const original = btn.innerHTML;
            btn.innerHTML = '✅ Copied!';
            setTimeout(() => btn.innerHTML = original, 1500);
        });
    }

    // Support Tab key for indentation
    noteAreaEl.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = noteAreaEl.selectionStart;
            const end = noteAreaEl.selectionEnd;
            noteAreaEl.value = noteAreaEl.value.substring(0, start) + '    ' + noteAreaEl.value.substring(end);
            noteAreaEl.selectionStart = noteAreaEl.selectionEnd = start + 4;
            handleContentChange();
        }
    });

    window.onload = init;
</script>

</body>
</html>
