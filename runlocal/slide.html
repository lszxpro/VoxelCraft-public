itos e costumes.", "image": 0}, {"title": "HISTÓRIA E SOCIEDADE", "text": "As Diretas Já (1983–1984) pediam eleições diretas para presidente. A ditadura militar terminou no Brasil em 1985. Em 1989, a queda do Muro de Berlim marcou uma grande mudança no mundo. Esses fatos marcaram a história da década.", "image": 1}, {"title": "MODA DOS ANOS 80", "text": "Jaquetas e calças jeans, cores vibrantes, tênis de cano alto e acessórios chamativos faziam sucesso. Cabelos volumosos e artistas como Madonna e Michael Jackson também influenciavam o estilo. As roupas também expressavam personalidade.", "image": 2}, {"title": "MÚSICA E ARTISTAS", "text": "Michael Jackson, Madonna e Queen marcaram a música internacional. No Brasil, o rock ganhou força com Legião Urbana e Cazuza. Muitas dessas canções continuam tocando até hoje. Ouvir e gravar fitas fazia parte da rotina.", "image": 3}, {"title": "TECNOLOGIA E DIVERSÃO", "text": "Televisões de tubo, filmes em VHS e músicas em fitas cassete faziam parte da rotina. Atari, fliperamas e o cubo mágico estavam entre as formas de diversão da época. As brincadeiras reuniam amigos e familiares.", "image": 4}, {"title": "O LEGADO DOS ANOS 80", "text": "A década deixou músicas inesquecíveis, uma moda marcante e avanços tecnológicos. Sua influência continua presente. Essas referências ligam o passado ao presente.<br><br>Agora, vamos apresentar nosso elemento surpresa!", "image": 0}];
let current=0,angle=0,busy=false,bgIndex=0,timer=null;
const wheel=document.querySelector('#wheel'),copy=document.querySelector('#copy'),bgs=[document.querySelector('#bg0'),document.querySelector('#bg1')],sectors=[];
for(let i=0;i<4;i++){let s=document.createElement('div');s.className='sector';s.style.setProperty('--a',i*90+'deg');let im=document.createElement('img');im.src=images[slides[i%slides.length].image];im.alt='';s.style.backgroundImage='url('+im.src+')';s.append(im);wheel.append(s);sectors.push(im)}
function content(){document.querySelector('#signature').hidden=current!==0;copy.querySelector('h1').textContent=slides[current].title;copy.querySelector('p').innerHTML=slides[current].text;document.querySelector('#count').textContent=(current+1)+' / '+slides.length;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1}
bgs[0].src=images[slides[0].image];content();
function go(target){if(busy||target<0||target>=slides.length||target===current)return;busy=true;let direction=target>current?1:-1;angle-=direction*90;let active=((Math.round(-angle/90)%4)+4)%4;sectors[active].src=images[slides[target].image];sectors[active].parentElement.style.backgroundImage='url('+sectors[active].src+')';const other=1-bgIndex;bgs[other].src=images[slides[target].image];bgs[other].classList.add('visible');bgs[bgIndex].classList.remove('visible');bgIndex=other;copy.classList.remove('arrive');copy.classList.add('depart');wheel.style.transform='rotate('+angle+'deg)';setTimeout(()=>{current=target;content();copy.classList.remove('depart');copy.classList.add('arrive')},430);setTimeout(()=>{busy=false;if(current===slides.length-1)stop()},1850)}
function stop(){clearInterval(timer);timer=null;document.querySelector('#auto').textContent='▶ Automático'}
function automatic(){if(timer){stop();return}if(current===slides.length-1)go(0);timer=setInterval(()=>go(current+1),14000);document.querySelector('#auto').textContent='Ⅱ Pausar'}
function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}
document.querySelector('#prev').onclick=()=>{stop();go(current-1)};document.querySelector('#next').onclick=()=>{stop();go(current+1)};document.querySelector('#auto').onclick=automatic;document.querySelector('#full').onclick=full;
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();stop();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();stop();go(current-1)}if(e.key==='Home'){stop();go(0)}if(e.key==='End'){stop();go(slides.length-1)}if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='a')automatic()});
let sx=0;document.addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>60){stop();go(current+(dx<0?1:-1))}},{passive:true});
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}addEventListener('resize',resize);resize();
