<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelCraft App Center & Launcher</title>
    <!-- Inter Font & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --card-sub: #21262d;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
            --accent-green: #3fb950;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navigation Header */
        header {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.25);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--accent-blue);
        }

        .repo-badge {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .repo-badge:hover {
            background: rgba(88, 166, 255, 0.2);
            border-color: var(--accent-blue);
        }

        /* Container & Controls */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 36px 24px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .dashboard-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-badge {
            background: var(--card-sub);
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .search-and-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 500px;
            justify-content: flex-end;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
        }

        .btn-action {
            background: rgba(88, 166, 255, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.25);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-action:hover {
            background: rgba(88, 166, 255, 0.25);
            border-color: var(--accent-blue);
        }

        /* App Cards Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.25s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(88, 166, 255, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background: var(--card-sub);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--accent-blue);
        }

        .card-path {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .tag-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--card-sub);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-launch {
            background: #1f6feb;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
        }

        .btn-launch:hover {
            background: #388bfd;
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }

        /* Loading & Empty States */
        .loading-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(88, 166, 255, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 20px 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--card-bg);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="layout-grid"></i>
            </div>
            <div class="brand-title">App<span>Center</span></div>
        </div>
        <a href="https://github.com/lszxpro/VoxelCraft-public" target="_blank" class="repo-badge">
            <i data-lucide="folder-git-2" style="width: 14px; height: 14px;"></i>
            <span>lszxpro / VoxelCraft-public</span>
        </a>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        
        <!-- Controls Bar -->
        <section class="dashboard-controls">
            <div class="status-info">
                <div class="status-title">
                    <i data-lucide="sparkles" style="width: 18px; height: 18px; color: var(--accent-blue);"></i>
                    <span>Discovered Applications</span>
                </div>
                <span id="appCount" class="count-badge">0</span>
            </div>

            <div class="search-and-actions">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" oninput="filterApps()" placeholder="Search apps by name or path...">
                </div>
                <button class="btn-action" onclick="scanRepository()">
                    <i data-lucide="rotate-cw" style="width: 14px; height: 14px;"></i>
                    <span>Rescan Repo</span>
                </button>
            </div>
        </section>

        <!-- Dynamic Applications Grid -->
        <section class="grid" id="appsGrid">
            <div class="loading-box">
                <div class="spinner"></div>
                <p>Scanning GitHub repository for HTML applications...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>VoxelCraft App Center &bull; Automatically powered by GitHub Pages API</p>
    </footer>

    <script>
        const REPO_OWNER = 'lszxpro';
        const REPO_NAME = 'VoxelCraft-public';
        const BASE_PAGES_URL = `https://${REPO_OWNER}.github.io/${REPO_NAME}/`;
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`;

        let loadedAppsList = [];

        // Project registry with titles, icons, descriptions, and technology tags
        const knownApps = {
            'voxelgame/index.html': {
                title: 'VoxelCraft 3D Engine',
                icon: '🧊',
                desc: 'An interactive 3D voxel builder and sandbox environment built directly in HTML and JavaScript using Three.js.',
                tags: ['Three.js', '3D Engine', 'Sandbox']
            },
            'ailauncher/index.html': {
                title: 'Universal AI Client',
                icon: '⚡',
                desc: 'A full-featured multi-provider AI chat workspace supporting custom profiles, file attachments, and code highlighting.',
                tags: ['AI Assistant', 'OpenRouter', 'Gemini API']
            },
            'modflix/index.html': {
                title: 'ModFlix Explorer',
                icon: '🎬',
                desc: 'A modern Netflix-inspired streaming browser for discovering Minecraft mods and content using the Modrinth API.',
                tags: ['Minecraft Mods', 'Modrinth API', 'Explorer']
            },
            'hub.html': {
                title: 'Personal Dashboard & Gallery',
                icon: '📊',
                desc: 'A GitHub-style personal workspace for managing active software projects, progress metrics, and task boards.',
                tags: ['Dashboard', 'Kanban', 'Projects']
            },
            'projects.html': {
                title: 'Personal Dashboard & Gallery',
                icon: '📊',
                desc: 'A GitHub-style personal workspace for managing active software projects, progress metrics, and task boards.',
                tags: ['Dashboard', 'Kanban', 'Projects']
            },
            'game3d.html': {
                title: '3D Space Fighter Engine',
                icon: '🚀',
                desc: 'A Three.js web-based 3D space action game featuring lighting effects, custom models, and particle systems.',
                tags: ['Web Game', 'Three.js', 'Arcade']
            }
        };

        window.onload = () => {
            scanRepository();
        };

        function resolveAppDetails(path) {
            const cleanPath = path.toLowerCase();

            // Check exact match in known registry
            if (knownApps[cleanPath]) {
                return knownApps[cleanPath];
            }

            // Fallback for subfolders or root files
            let fileName = path.split('/').pop().replace('.html', '');
            if (fileName.toLowerCase() === 'index') {
                const parts = path.split('/');
                fileName = parts.length > 1 ? parts[parts.length - 2] : 'Home App';
            }

            // Determine appropriate icon and tags dynamically
            let icon = '⚡';
            let desc = 'Web application deployed within the VoxelCraft ecosystem.';
            let tags = ['Web App', 'HTML5'];

            if (cleanPath.includes('voxel') || cleanPath.includes('block') || cleanPath.includes('craft')) {
                icon = '🧊';
                desc = 'Voxel building or block-based interactive environment.';
                tags = ['Voxel', '3D Web'];
            } else if (cleanPath.includes('ai') || cleanPath.includes('chat') || cleanPath.includes('gpt')) {
                icon = '🤖';
                desc = 'Intelligent conversational client and prompt engine.';
                tags = ['AI Tool', 'Chat Client'];
            } else if (cleanPath.includes('mod') || cleanPath.includes('flix') || cleanPath.includes('media')) {
                icon = '🎬';
                desc = 'Content discovery hub and media exploration interface.';
                tags = ['Media', 'Modrinth'];
            } else if (cleanPath.includes('game') || cleanPath.includes('play')) {
                icon = '🎮';
                desc = 'Interactive browser game and entertainment experience.';
                tags = ['Browser Game', 'JS'];
            } else if (cleanPath.includes('dash') || cleanPath.includes('board') || cleanPath.includes('hub')) {
                icon = '📊';
                desc = 'Management interface and personal productivity dashboard.';
                tags = ['Dashboard', 'Tools'];
            }

            // Format Title
            const formattedTitle = fileName
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());

            return {
                title: formattedTitle,
                icon: icon,
                desc: desc,
                tags: tags
            };
        }

        async function scanRepository() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = `
                <div class="loading-box">
                    <div class="spinner"></div>
                    <p>Connecting to GitHub API and discovering HTML applications...</p>
                </div>
            `;

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`GitHub API returned status ${response.status}`);
                }

                const data = await response.json();

                if (!data.tree) {
                    grid.innerHTML = `<div class="loading-box">Unable to read repository structure or API rate limit exceeded.</div>`;
                    return;
                }

                // Filter out AppCenter index.html at root to prevent recursive loop
                const htmlFiles = data.tree.filter(item => 
                    item.type === 'blob' && 
                    item.path.endsWith('.html') && 
                    item.path.toLowerCase() !== 'index.html' &&
                    item.path.toLowerCase() !== 'appcenter.html'
                );

                if (htmlFiles.length === 0) {
                    grid.innerHTML = `<div class="loading-box">No secondary HTML applications found in the repository main branch.</div>`;
                    document.getElementById('appCount').innerText = '0';
                    return;
                }

                loadedAppsList = htmlFiles.map(file => ({
                    path: file.path,
                    fullUrl: BASE_PAGES_URL + file.path,
                    details: resolveAppDetails(file.path)
                }));

                document.getElementById('appCount').innerText = loadedAppsList.length;
                renderApps(loadedAppsList);

            } catch (error) {
                console.error(error);
                grid.innerHTML = `<div class="loading-box">Error fetching repository metadata from GitHub. Please try again later.</div>`;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';

            if (apps.length === 0) {
                grid.innerHTML = `<div class="loading-box">No applications match your search query.</div>`;
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${app.details.icon}</div>
                        <span class="card-path">/${app.path}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${app.details.title}</div>
                        <div class="card-desc">${app.details.desc}</div>
                        <div class="card-tags">
                            ${app.details.tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <a href="${app.fullUrl}" target="_blank" class="btn-launch">
                        <span>Launch App</span>
                        <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                    </a>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = loadedAppsList.filter(app => 
                app.details.title.toLowerCase().includes(query) ||
                app.details.desc.toLowerCase().includes(query) ||
                app.path.toLowerCase().includes(query) ||
                app.details.tags.some(tag => tag.toLowerCase().includes(query))
            );
            renderApps(filtered);
        }
    </script>
</body>
</html>
