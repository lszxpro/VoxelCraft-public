
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModFlix - Mods, Modpacks e Shaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
        }

        /* Cabecalho */
        header {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 2px solid #1db954;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #1db954;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .logo span {
            color: #fff;
        }

        .search-container {
            display: flex;
            align-items: center;
            width: 50%;
            max-width: 500px;
        }

        .search-container input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px 0 0 25px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            padding: 12px 25px;
            border: none;
            border-radius: 0 25px 25px 0;
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .search-container button:hover {
            background-color: #1ed760;
        }

        .tabs {
            display: flex;
            gap: 15px;
            padding: 0 30px 15px 30px;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .tab-btn:hover {
            background-color: #333;
        }

        .tab-btn.active {
            background-color: #fff;
            color: #000;
        }

        /* Layout Principal com Barra Lateral */
        .content-wrapper {
            display: flex;
            padding: 30px;
            gap: 30px;
            align-items: flex-start;
        }

        /* Barra Lateral */
        aside {
            width: 250px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            flex-shrink: 0;
            border: 1px solid #2a2a2a;
            position: sticky;
            top: 150px; /* Mantém a barra fixa ao rolar a página */
        }

        aside h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #1db954;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .filter-group select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .filter-group select:focus {
            border-color: #1db954;
        }

        /* Grid de Mods */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(29, 185, 84, 0.2);
            border-color: #1db954;
        }

        .type-badge {
            position: absolute;
            top: -10px;
            right: 15px;
            background-color: #1db954;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .mod-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .mod-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .mod-author {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .mod-desc {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .mod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            border-top: 1px solid #2a2a2a;
            padding-top: 15px;
        }

        .downloads {
            color: #1db954;
        }

        .categories {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .status-message {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 18px;
            width: 100%;
        }

        /* Responsividade para telas menores (celulares) */
        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
            }
            aside {
                width: 100%;
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo" onclick="goHome()">Mod<span>Flix</span></div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar (ex: sodium, RPG...)">
                <button id="searchBtn">Pesquisar</button>
            </div>
            <div style="width: 100px;"></div>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('')">Tudo</button>
            <button class="tab-btn" onclick="setTab('mod')">🧩 Mods</button>
            <button class="tab-btn" onclick="setTab('modpack')">📦 Modpacks</button>
            <button class="tab-btn" onclick="setTab('shader')">✨ Shaders</button>
            <button class="tab-btn" onclick="setTab('resourcepack')">🎨 Texturas</button>
        </div>
    </header>

    <div class="content-wrapper">
        <!-- Barra Lateral (Filtros) -->
        <aside>
            <h3>Filtros Avançados</h3>
            
            <div class="filter-group">
                <label for="loaderSelect">Loader (Carregador)</label>
                <select id="loaderSelect" onchange="applyFilters()">
                    <option value="">Qualquer</option>
                    <option value="fabric">Fabric</option>
                    <option value="forge">Forge</option>
                    <option value="quilt">Quilt</option>
                    <option value="neoforge">NeoForge</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="versionSelect">Versão do Jogo</label>
                <select id="versionSelect" onchange="applyFilters()">
                    <option value="">Qualquer</option>
                    <option value="1.21.1">1.21.1</option>
                    <option value="1.21">1.21</option>
                    <option value="1.20.4">1.20.4</option>
                    <option value="1.20.1">1.20.1</option>
                    <option value="1.19.2">1.19.2</option>
                    <option value="1.18.2">1.18.2</option>
                    <option value="1.16.5">1.16.5</option>
                    <option value="1.12.2">1.12.2</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="categorySelect">Categoria Principal</label>
                <select id="categorySelect" onchange="applyFilters()">
                    <option value="">Qualquer</option>
                    <option value="optimization">Otimização (FPS)</option>
                    <option value="technology">Tecnologia</option>
                    <option value="magic">Magia</option>
                    <option value="adventure">Aventura & RPG</option>
                    <option value="worldgen">Geração de Mundo</option>
                    <option value="utility">Utilidades</option>
                    <option value="equipment">Equipamentos (Armas/Armaduras)</option>
                </select>
            </div>
        </aside>

        <!-- Container da Grid e do Status -->
        <div style="flex: 1; display: flex; flex-direction: column;">
            <main id="modGrid"></main>
            <div id="statusMessage" class="status-message">Carregando os melhores conteúdos...</div>
        </div>
    </div>

    <script>
        let currentOffset = 0;
        let currentQuery = '';
        let currentType = ''; 
        let isFetching = false;
        let hasMore = true;

        const grid = document.getElementById('modGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        // Elementos dos filtros da sidebar
        const loaderSelect = document.getElementById('loaderSelect');
        const versionSelect = document.getElementById('versionSelect');
        const categorySelect = document.getElementById('categorySelect');

        function goHome() {
            searchInput.value = '';
            currentQuery = '';
            loaderSelect.value = '';
            versionSelect.value = '';
            categorySelect.value = '';
            setTab('');
        }

        // Chamada quando muda de aba
        function setTab(type, eventElement) {
            currentType = type;
            currentOffset = 0;
            hasMore = true;
            grid.innerHTML = '';
            
            if (eventElement || event) {
                const target = eventElement || event.currentTarget;
                if (target && target.classList) {
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    target.classList.add('active');
                }
            }

            fetchMods();
        }

        // Chamada quando altera qualquer select na barra lateral
        function applyFilters() {
            currentOffset = 0;
            hasMore = true;
            grid.innerHTML = '';
            fetchMods();
        }

        async function fetchMods() {
            if (isFetching || !hasMore) return;
            
            isFetching = true;
            statusMessage.style.display = 'block';
            statusMessage.innerText = 'Buscando na ModFlix...';

            try {
                // Constrói o array de filtros (facets) baseado nas escolhas
                let facetsArray = [];
                
                if (currentType !== '') {
                    facetsArray.push([`project_type:${currentType}`]);
                }
                
                if (loaderSelect.value !== '') {
                    facetsArray.push([`categories:${loaderSelect.value}`]);
                }
                
                if (versionSelect.value !== '') {
                    facetsArray.push([`versions:${versionSelect.value}`]);
                }
                
                if (categorySelect.value !== '') {
                    facetsArray.push([`categories:${categorySelect.value}`]);
                }

                let facetsParam = '';
                if (facetsArray.length > 0) {
                    // O Modrinth precisa que o JSON seja passado assim na URL
                    facetsParam = `&facets=${encodeURIComponent(JSON.stringify(facetsArray))}`;
                }

                const url = `https://api.modrinth.com/v2/search?query=${encodeURIComponent(currentQuery)}&limit=20&offset=${currentOffset}${facetsParam}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.hits && data.hits.length > 0) {
                    renderMods(data.hits);
                    statusMessage.style.display = 'none';
                    
                    if (data.hits.length < 20) {
                        hasMore = false;
                        statusMessage.style.display = 'block';
                        statusMessage.innerText = 'Fim da lista.';
                    }
                } else {
                    hasMore = false;
                    if (currentOffset === 0) {
                        statusMessage.innerText = 'Nada encontrado com esses filtros. Tenta mudar alguma opção!';
                    } else {
                        statusMessage.innerText = 'Fim da lista.';
                    }
                }
            } catch (error) {
                console.error('Erro:', error);
                statusMessage.innerText = 'Deu ruim na conexão com a API.';
            }

            isFetching = false;
        }

        function renderMods(mods) {
            mods.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.open(`https://modrinth.com/${mod.project_type}/${mod.slug}`, '_blank');

                let downloads = mod.downloads;
                if (downloads > 1000000) {
                    downloads = (downloads / 1000000).toFixed(1) + 'M';
                } else if (downloads > 1000) {
                    downloads = (downloads / 1000).toFixed(1) + 'k';
                }

                const iconUrl = mod.icon_url || 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
                const cats = mod.categories.slice(0, 3).map(c => `<span class="badge">${c}</span>`).join('');
                
                let typeName = mod.project_type;
                if(typeName === 'mod') typeName = 'Mod';
                if(typeName === 'modpack') typeName = 'Modpack';
                if(typeName === 'shader') typeName = 'Shader';
                if(typeName === 'resourcepack') typeName = 'Textura';

                card.innerHTML = `
                    <div class="type-badge">${typeName}</div>
                    <div class="card-header">
                        <img src="${iconUrl}" alt="Icon" class="mod-icon">
                        <div>
                            <div class="mod-title">${mod.title}</div>
                            <div class="mod-author">por ${mod.author}</div>
                        </div>
                    </div>
                    <div class="mod-desc">${mod.description}</div>
                    <div class="mod-footer">
                        <div class="categories">${cats}</div>
                        <div class="downloads">⬇ ${downloads}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const val = searchInput.value.trim();
            currentQuery = val;
            currentOffset = 0; 
            hasMore = true;
            grid.innerHTML = ''; 
            fetchMods();
        }

        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                if (!isFetching && hasMore) {
                    currentOffset += 20; 
                    fetchMods();
                }
            }
        });

        fetchMods();
    </script>
</body>
</html>
